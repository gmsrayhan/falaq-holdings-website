<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Falaq Holdings Ltd.</title>

    <meta name="robots" content="noindex, nofollow">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="login-page">

        <div class="login-card">

            <div class="brand">
                <img src="../falaq-logo.jpeg" alt="Falaq Holdings Ltd.">
            </div>

            <div class="login-heading">
                <h1>Welcome Back</h1>
                <p>Sign in to Falaq Holdings Ltd. Administration</p>
            </div>

            <form id="loginForm">

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="admin@falaqholdingsltd.com"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <div class="password-box">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button type="button" id="togglePassword">
                            Show
                        </button>
                    </div>
                </div>

                <div class="login-options">
                    <label class="remember">
                        <input type="checkbox" id="remember">
                        <span>Remember me</span>
                    </label>

                    <a href="#" class="forgot-password">
                        Forgot Password?
                    </a>
                </div>

                <button type="submit" class="login-button">
                    Sign In
                </button>

                <div id="loginMessage" class="login-message"></div>

            </form>

            <div class="login-footer">
                <a href="../index.html">← Back to Website</a>
            </div>

        </div>

        <div class="copyright">
            © 2026 Falaq Holdings Ltd. All rights reserved.
        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
