<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | Falaq Holdings Ltd.</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b0b0b;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        .card {
            width: 100%;
            max-width: 430px;
            padding: 40px;
            background: #151515;
            border: 1px solid rgba(201,168,106,0.35);
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.45);
        }

        h1 {
            margin: 0 0 10px;
            color: #c9a86a;
            text-align: center;
        }

        p {
            color: #aaa;
            text-align: center;
            line-height: 1.6;
        }

        label {
            display: block;
            margin: 22px 0 8px;
            color: #ddd;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #444;
            border-radius: 8px;
            background: #0d0d0d;
            color: #fff;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #c9a86a;
            color: #111;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #dfc184;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            line-height: 1.5;
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>Reset Password</h1>

        <p>
            Enter your new password below.
        </p>

        <form id="resetForm">

            <label for="password">
                New Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter new password"
                minlength="6"
                required
            >

            <label for="confirmPassword">
                Confirm Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm new password"
                minlength="6"
                required
            >

            <button type="submit">
                Update Password
            </button>

        </form>

        <div id="message"></div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const SUPABASE_URL =
            "https://vhktiuhkvpvwugpibxbh.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_F1lBNaoYi0I0nX45r1a4ItQ_fjq991lC";

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );

        const resetForm =
            document.getElementById("resetForm");

        const message =
            document.getElementById("message");

        resetForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();

                const password =
                    document.getElementById("password").value;

                const confirmPassword =
                    document.getElementById("confirmPassword").value;

                if (password !== confirmPassword) {

                    message.textContent =
                        "Passwords do not match.";

                    message.style.color = "#d88";

                    return;
                }

                message.textContent =
                    "Updating password...";

                message.style.color = "#c9a86a";

                const { error } =
                    await supabaseClient.auth.updateUser({
                        password: password
                    });

                if (error) {

                    message.textContent =
                        "Unable to update password: " +
                        error.message;

                    message.style.color = "#d88";

                    return;
                }

                message.textContent =
                    "Password updated successfully. You can now login.";

                message.style.color = "#8fd19e";

                resetForm.reset();

                setTimeout(function () {

                    window.location.href =
                        "index.html";

                }, 2000);

            }
        );
    </script>

</body>
</html>
